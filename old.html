
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Архив AEMP PRO — старые версии</title>

    <meta name="description" content="Архив предыдущих версий музыкального плеера AEMP PRO.">

    <meta name="author" content="Artem Eremeev">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://artemeremeev29-dotcom.github.io/AEMP-site/old.html">

    <meta name="theme-color" content="#171717">

    <link rel="stylesheet" href="style.css">

    <style>
        .archive-release {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #383838;
        }

        .archive-release:last-child {
            border-bottom: none;
        }

        .archive-release .aemp-app-icon {
            width: 76px;
            height: 76px;
            min-width: 76px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #080808;
            box-shadow: 0 0 0 1px #FF8C00;
        }

        .archive-release-info {
            flex: 1;
            min-width: 150px;
        }

        .archive-release-info h2 {
            margin: 0 0 6px;
        }

        .archive-release-info p {
            margin: 0;
        }

        @media (max-width: 480px) {
            .archive-release {
                gap: 12px;
            }

            .archive-release .aemp-app-icon {
                width: 60px;
                height: 60px;
                min-width: 60px;
            }
        }
    </style>
</head>

<body>

<main id="page-content" data-page="old">

    <header class="page-header">
        <h1>Архив версий</h1>
        <p>Предыдущие выпуски AEMP PRO.</p>
    </header>

    <section class="card">

        <p class="muted" id="archiveStatus">
            Загружаем архив...
        </p>

        <div id="archiveList"></div>

    </section>

    <section class="card">

        <h2>Не нашли нужную версию?</h2>

        <p>Посмотрите полный список выпусков проекта на GitHub.</p>

        <a class="secondary-button"
           href="https://github.com/artemeremeev29-dotcom/AEMP-PRO/releases"
           target="_blank"
           rel="noopener">

            Открыть GitHub Releases

        </a>

    </section>

    <footer>© AEMP Project. Enjoy the sound.</footer>

</main>

<script src="shell.js"></script>
<script src="old.js?v=4"></script>

</body>
</html>
